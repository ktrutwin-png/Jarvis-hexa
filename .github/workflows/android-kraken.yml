name: Android Kraken CI
concurrency:
  group: android-kraken-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths: ["android-kraken/**", ".github/workflows/android-kraken.yml"]
  push:
    branches: ["android-kraken-app"]
    paths: ["android-kraken/**", ".github/workflows/android-kraken.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kraken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle testDebugUnitTest
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kraken-trade-debug-apk
          path: android-kraken/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
