name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - "heksa/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: nextrade-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project and Flet CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[cli]>=1.0.4,<2" -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q android_app heksa

      - name: Build release APK
        run: flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexTrade-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
