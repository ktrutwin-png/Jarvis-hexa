name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "android_app/**"
      - "heksa/**"
      - "tests/**"
      - "packages/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: nextrade-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core test dependencies
        run: python -m pip install pytest "krakenex>=2.2.2,<3" "talipp>=2.7,<3"
      - name: Run safety and core tests
        run: python -m pytest -q

  build-apk:
    needs: test-core
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Flutter SDK and Flet downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/flutter/3.44.8
            ~/.flet/cache
          key: nextrade-native-${{ runner.os }}-flet1.0.4-flutter3.44.8
      - name: Build Android APK with foreground service
        env:
          PYTHONUTF8: "1"
          FLET_CLI_NO_RICH_OUTPUT: "1"
          NEXTRADE_BUILD_NUMBER: ${{ github.run_number }}
        run: uv run python scripts/build_android.py build apk --python-version 3.12 --build-number "$NEXTRADE_BUILD_NUMBER" --verbose
      - name: Archive installable APK
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile
          apks = list(Path("build/apk").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected one universal APK; found {len(apks)}")
          apk = apks[0].read_bytes()
          digest = hashlib.sha256(apk).hexdigest()
          with zipfile.ZipFile("NexTrade-Android-APK.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("nextrade-android.apk", apk)
              archive.writestr("SHA256SUMS", digest + "  nextrade-android.apk\n")
          PY
      - name: Upload APK bundle
        uses: actions/upload-artifact@v7
        with:
          name: NexTrade-Android-APK
          path: NexTrade-Android-APK.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
