name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - "heksa/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: nextrade-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Android APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          cache: true
          extra-args: "--verbose"

      - name: Upload APK bundle
        uses: actions/upload-artifact@v7
        with:
          name: NexTrade-Android-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
