name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "android_app/**"
      - "heksa/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: nextrade-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "krakenex>=2.2.2,<3" "talipp>=2.7,<3"

      - name: Run safety and core tests
        run: python -m pytest -q

  build-apk:
    needs: test-core
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Android APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          cache: true
          extra-args: "--verbose"

      - name: Upload APK bundle
        uses: actions/upload-artifact@v7
        with:
          name: NexTrade-Android-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
