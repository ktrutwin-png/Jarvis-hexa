[project]
name = "nextrade-android"
version = "0.1.0"
description = "NexTrade - bezpieczny asystent rynku kryptowalut na Androida"
requires-python = ">=3.10"
authors = [{name = "NexTrade"}]
dependencies = [
    "flet==1.0.4",
    "flet-secure-storage==1.0.4",
    "krakenex>=2.2.2,<3",
    "talipp>=2.7,<3",
]

[dependency-groups]
dev = ["flet-cli==1.0.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heksa*", "android_app*"]

[tool.flet]
org = "com.heksa"
product = "NexTrade"
company = "Heksa"
build_number = 1
app.module = "main"
app.path = "."
app.exclude = [
    ".git",
    ".github",
    ".venv",
    "build",
    "dist",
    "tests",
    "__pycache__",
]

[tool.flet.splash]
color = "#071021"
dark_color = "#071021"
android = true

[tool.flet.android]
# krakenex publishes a pure-Python source distribution instead of a wheel.
source_packages = ["krakenex"]
split_per_abi = false
legacy_packaging = false

[tool.flet.android.permission]
"android.permission.INTERNET" = true
