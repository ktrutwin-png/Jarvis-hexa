[project]
name = "nextrade-android"
version = "0.3.0"
description = "NexTrade - bezpieczny asystent rynku kryptowalut na Androida"
requires-python = ">=3.11"
authors = [{name = "NexTrade"}]
dependencies = [
    "flet==1.0.4",
    "flet-secure-storage==1.0.4",
    "flet-android-notifications==0.12.0",
    "nextrade-background==0.1.0",
    "krakenex>=2.2.2,<3",
    "talipp>=2.7,<3",
]

[dependency-groups]
dev = ["flet-cli==1.0.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heksa*", "android_app*"]

[tool.flet]
org = "com.heksa"
product = "NexTrade"
company = "Heksa"
build_number = 3
app.module = "main"
app.path = "."
app.exclude = [
    ".git",
    ".github",
    ".venv",
    "build",
    "dist",
    "tests",
    "__pycache__",
    "packages",
    "scripts",
    "deploy",
]

[tool.flet.splash]
color = "#071021"
dark_color = "#071021"
android = true

[tool.flet.android]
# krakenex publishes a pure-Python source distribution instead of a wheel.
source_packages = ["krakenex"]
split_per_abi = false
legacy_packaging = false

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true
"android.permission.WAKE_LOCK" = true
"android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" = true
"android.permission.ACCESS_WIFI_STATE" = true
"android.permission.CHANGE_WIFI_STATE" = true

[tool.flet.dev_packages]
nextrade-background = "packages/nextrade-background"

[tool.uv.sources]
nextrade-background = { path = "packages/nextrade-background" }

